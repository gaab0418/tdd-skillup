name: SkillUp CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: CI - Testes Unitarios + Integracao + E2E
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: skillup
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v6
    
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'npm'

    - name: Instalar dependencias
      run: npm install

    - name: Criar .env
      run: |
        echo "DB_HOST=127.0.0.1" > .env
        echo "DB_PORT=3306" >> .env
        echo "DB_USER=root" >> .env
        echo "DB_PASS=root" >> .env
        echo "DB_NAME=skillup" >> .env
        echo "DB_DEBUG=true" >> .env
        echo "APP_PORT=3000" >> .env
        echo "NODE_ENV=test" >> .env
        echo "SESSION_SECRET=secret_teste" >> .env
        echo "UPLOAD_MAX_SIZE=52428800" >> .env

    - name: Executar Testes Unitarios e Integracao
      run: npm run test

    - name: Popular Banco - Seed
      run: npm run seed

    - name: Instalar Navegadores Playwright
      run: npx playwright install --with-deps

    - name: Executar Testes E2E
      run: npx playwright test

    - name: Upload Relatorio Playwright
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Resumo
      if: success()
      run: |
        echo "::notice title=Sucesso!::Todos os testes passaram."
        echo "### Resumo da Execucao" >> $GITHUB_STEP_SUMMARY
        echo "- **Setup e Dependencias**: Ok" >> $GITHUB_STEP_SUMMARY
        echo "- **Testes Unitarios e Integracao:** Ok" >> $GITHUB_STEP_SUMMARY
        echo "- **Seed do Banco:** Ok" >> $GITHUB_STEP_SUMMARY
        echo "- **Testes E2E (Playwright):** Ok" >> $GITHUB_STEP_SUMMARY
